<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetCare</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f6f4;color:#2b2b2b}
button{padding:8px 12px;border:none;background:#2f7d6d;color:#fff;border-radius:6px;cursor:pointer}
button.sec{background:#e08a3c}button.x{background:#b9473f}
input,select{padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit}
header{background:#2f7d6d;color:#fff;padding:14px 20px;border-bottom:4px solid #e08a3c;display:flex;justify-content:space-between;align-items:center}
#login{max-width:320px;margin:15vh auto;background:#fff;padding:24px;border-radius:10px;display:flex;flex-direction:column;gap:10px;border-top:4px solid #e08a3c}
#app{display:none;max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button.on{background:#e08a3c}
.card{background:#fff;padding:14px;border-radius:8px;border-top:3px solid #e08a3c;margin-bottom:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.b{font-size:12px;padding:2px 8px;border-radius:10px;background:#e3efe9}
.msg{padding:6px 10px;background:#f0f0f0;border-radius:8px;margin:4px 0;font-size:14px}
</style>
</head>
<body>
<header><b>🐾 PetCare</b><span id="quien"></span></header>

<div id="login">
  <h3 style="margin:0">Acceso</h3>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="entrar()">Entrar</button>
  <button class="sec" onclick="registro()">Registrarse</button>
</div>

<div id="app">
  <nav>
    <button id="t-mascotas" onclick="ir('mascotas')">🐶 Mascotas</button>
    <button id="t-citas" onclick="ir('citas')">📅 Citas</button>
    <button id="t-registro" onclick="ir('registro')">🔒 Actividad</button>
  </nav>
  <div id="vista"></div>
</div>

<script>
let token = "", mascotas = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fecha = d => new Date(d).toLocaleString();

async function api(url, method = "GET", body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401 && token) return location.reload();
  const d = await res.json();
  if (!res.ok) { alert(d.error || "Error"); throw new Error(d.error); }
  return d;
}

async function pedir(ruta) {
  const res = await fetch(ruta, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("user").value, password: $("pass").value }) });
  return { res, d: await res.json() };
}
async function entrar() {
  const { res, d } = await pedir("/login");
  if (!res.ok) return alert(d.error || "Error de login");
  token = d.token; $("quien").innerText = "👤 " + d.username;
  $("login").style.display = "none"; $("app").style.display = "block";
  ir("mascotas");
}
async function registro() {
  const { res, d } = await pedir("/registro");
  alert(res.ok ? "Usuario creado, ya puedes entrar" : d.error);
}

function ir(v) {
  ["mascotas", "citas", "registro"].forEach(t => $("t-" + t).className = t === v ? "on" : "");
  ({ mascotas: verMascotas, citas: verCitas, registro: verRegistro })[v]();
}

// ----- Mascotas e historial -----
async function verMascotas() {
  mascotas = await api("/mascotas");
  $("vista").innerHTML = `
    <div class="card"><b>Nueva mascota</b><div class="row">
      <input id="m-nombre" placeholder="Nombre">
      <select id="m-especie"><option>Perro</option><option>Gato</option><option>Ave</option><option>Otro</option></select>
      <input id="m-raza" placeholder="Raza">
      <input id="m-edad" type="number" min="0" placeholder="Edad" style="width:80px">
      <button onclick="crearMascota()">Guardar</button></div></div>` +
    (mascotas.map(m => `
    <div class="card"><div class="row"><b style="flex:1">${esc(m.nombre)}</b>
      <span class="b">${esc(m.especie)}</span><span class="b">${esc(m.raza) || "sin raza"}</span>
      <span class="b">${m.edad ?? "?"} años</span>
      <button class="x" onclick="borrarMascota('${m._id}')">Eliminar</button></div>
      ${m.historial.map(h => `<div class="msg">${h.tipo === "vacuna" ? "💉" : "📝"} ${esc(h.texto)} <small>(${fecha(h.fecha)})</small></div>`).join("") || "<i>Sin historial</i>"}
      <div class="row"><select id="h-t-${m._id}"><option value="vacuna">Vacuna</option><option value="nota">Nota</option></select>
      <input id="h-x-${m._id}" placeholder="Detalle" style="flex:1">
      <button onclick="addHistorial('${m._id}')">Añadir</button></div></div>`).join("") || "<p>Aún no tienes mascotas.</p>");
}
async function crearMascota() {
  const nombre = $("m-nombre").value.trim(); if (!nombre) return alert("Escribe el nombre");
  await api("/mascotas", "POST", { nombre, especie: $("m-especie").value, raza: $("m-raza").value,
    edad: $("m-edad").value === "" ? undefined : Number($("m-edad").value) });
  verMascotas();
}
async function borrarMascota(id) {
  if (!confirm("¿Eliminar la mascota y sus citas?")) return;
  await api("/mascotas/" + id, "DELETE"); verMascotas();
}
async function addHistorial(id) {
  const texto = $("h-x-" + id).value.trim(); if (!texto) return;
  await api(`/mascotas/${id}/historial`, "POST", { tipo: $("h-t-" + id).value, texto }); verMascotas();
}

// ----- Citas -----
async function verCitas() {
  const [ms, cs] = await Promise.all([api("/mascotas"), api("/citas")]);
  mascotas = ms;
  const nombre = id => (ms.find(m => m._id === id) || {}).nombre || "?";
  $("vista").innerHTML = `
    <div class="card"><b>Agendar cita</b><div class="row">
      <select id="c-m">${ms.map(m => `<option value="${m._id}">${esc(m.nombre)}</option>`).join("")}</select>
      <select id="c-motivo"><option>consulta</option><option>vacuna</option><option>baño</option><option>otro</option></select>
      <input id="c-cuando" type="datetime-local">
      <button onclick="crearCita()">Agendar</button></div>
      ${ms.length ? "" : "<small>Primero registra una mascota.</small>"}</div>` +
    (cs.map(c => `
    <div class="card"><div class="row"><b style="flex:1">${esc(nombre(c.mascota))} — ${esc(c.motivo)}</b>
      <span>${fecha(c.cuando)}</span>
      <select onchange="estadoCita('${c._id}',this.value)">${["pendiente", "confirmada", "cancelada"]
        .map(e => `<option ${e === c.estado ? "selected" : ""}>${e}</option>`).join("")}</select>
      <button class="x" onclick="borrarCita('${c._id}')">✕</button></div></div>`).join("") || "<p>Sin citas.</p>");
}
async function crearCita() {
  const cuando = $("c-cuando").value;
  if (!$("c-m").value || !cuando) return alert("Elige mascota y fecha");
  await api("/citas", "POST", { mascota: $("c-m").value, motivo: $("c-motivo").value, cuando: new Date(cuando).toISOString() });
  verCitas();
}
async function estadoCita(id, estado) { await api("/citas/" + id, "PATCH", { estado }); }
async function borrarCita(id) { await api("/citas/" + id, "DELETE"); verCitas(); }

// ----- Registro de actividad -----
async function verRegistro() {
  const r = await api("/registros");
  $("vista").innerHTML = `<div class="card"><b>🔒 Registro de actividad</b>` +
    (r.map(x => `<div class="msg">${fecha(x.fecha)} — <b>${esc(x.usuario)}</b>: ${esc(x.accion)} ${esc(x.detalle)}</div>`).join("") || "<p>Sin actividad.</p>") + `</div>`;
}
$("pass").addEventListener("keypress", e => { if (e.key === "Enter") entrar(); });
</script>
</body>
</html>
